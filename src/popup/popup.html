<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepStack</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/panels.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div id="brand-logo" class="brand-logo" aria-hidden="true"></div>
        <div class="brand-text">
          <h1 id="host" class="host mono">Inspecting…</h1>
          <p id="strategy" class="strategy">Reading page architecture</p>
        </div>
      </div>

      <div class="actions">
        <button id="btn-rescan" class="icon-btn" type="button" title="Rescan (R)" aria-label="Rescan page"></button>

        <div class="menu-wrap">
          <button id="btn-export" class="icon-btn" type="button" title="Export report" aria-label="Export report" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-export" disabled></button>
          <div id="menu-export" class="menu" role="menu" hidden>
            <button type="button" role="menuitem" data-export="copy-md">Copy as Markdown <kbd>C</kbd></button>
            <button type="button" role="menuitem" data-export="copy-json">Copy as JSON</button>
            <div class="menu-sep" role="separator"></div>
            <button type="button" role="menuitem" data-export="save-md">Download .md</button>
            <button type="button" role="menuitem" data-export="save-json">Download .json</button>
          </div>
        </div>

        <div class="menu-wrap">
          <button id="btn-settings" class="icon-btn" type="button" title="Settings" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu-settings"></button>
          <div id="menu-settings" class="menu menu-settings" role="dialog" aria-label="Settings" hidden>
            <p class="menu-label">Theme</p>
            <div class="segmented" role="radiogroup" aria-label="Theme">
              <button type="button" role="radio" data-theme-choice="system">System</button>
              <button type="button" role="radio" data-theme-choice="light">Light</button>
              <button type="button" role="radio" data-theme-choice="dark">Dark</button>
            </div>
            <div class="menu-sep" role="separator"></div>
            <label class="switch-row">
              <span>
                <span class="switch-title">DNS lookups</span>
                <span class="switch-desc">Sends only the domain name to a public DNS-over-HTTPS resolver to identify hosting and email providers.</span>
              </span>
              <input id="toggle-dns" type="checkbox" class="switch" />
            </label>
          </div>
        </div>
      </div>
    </header>

    <section id="metrics" class="metrics" aria-label="Summary">
      <div class="metric"><span class="metric-label">Technologies</span><span id="m-tech" class="metric-value tnum"><i class="sk sk-sm"></i></span></div>
      <div class="metric"><span class="metric-label">Server response</span><span id="m-ttfb" class="metric-value tnum"><i class="sk sk-sm"></i></span></div>
      <div class="metric"><span class="metric-label">Protocol</span><span id="m-proto" class="metric-value tnum"><i class="sk sk-sm"></i></span></div>
      <div class="metric"><span class="metric-label">Security</span><span id="m-sec" class="metric-value tnum"><i class="sk sk-sm"></i></span></div>
    </section>

    <nav class="tabs" role="tablist" aria-label="Report sections">
      <button class="tab" role="tab" id="tab-stack" data-tab="stack" aria-controls="panel-stack" aria-selected="true">Stack <span id="count-stack" class="tab-count tnum"></span></button>
      <button class="tab" role="tab" id="tab-internals" data-tab="internals" aria-controls="panel-internals" aria-selected="false" tabindex="-1">Internals</button>
      <button class="tab" role="tab" id="tab-network" data-tab="network" aria-controls="panel-network" aria-selected="false" tabindex="-1">Network <span id="count-network" class="tab-count tnum"></span></button>
      <button class="tab" role="tab" id="tab-security" data-tab="security" aria-controls="panel-security" aria-selected="false" tabindex="-1">Security</button>
      <button class="tab" role="tab" id="tab-design" data-tab="design" aria-controls="panel-design" aria-selected="false" tabindex="-1">Design &amp; SEO</button>
    </nav>

    <main id="content" class="content" aria-busy="true">
      <div id="state-loading" class="skeleton" aria-label="Loading">
        <div class="sk sk-block"></div>
        <div class="sk sk-line w-40"></div>
        <div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div>
        <div class="sk sk-line w-30"></div>
        <div class="sk sk-row"></div><div class="sk sk-row"></div>
      </div>

      <div id="state-error" class="empty empty-full" hidden>
        <div id="error-icon" class="empty-icon"></div>
        <p id="error-title" class="empty-title">Can't inspect this page</p>
        <p id="error-desc" class="empty-desc"></p>
        <button id="btn-retry" class="btn" type="button">Try again</button>
      </div>

      <section id="panel-stack" class="panel" role="tabpanel" aria-labelledby="tab-stack" hidden>
        <div id="stack-overview"></div>
        <div class="toolbar">
          <label class="search">
            <span id="search-icon" class="search-icon" aria-hidden="true"></span>
            <input id="search" type="search" placeholder="Filter technologies" autocomplete="off" spellcheck="false" aria-label="Filter technologies" />
            <kbd class="search-kbd">/</kbd>
          </label>
          <button id="btn-evidence" class="btn btn-toggle" type="button" aria-pressed="false" title="Expand all evidence (E)">Show evidence</button>
        </div>
        <div id="stack-list"></div>
      </section>
      <section id="panel-internals" class="panel" role="tabpanel" aria-labelledby="tab-internals" hidden></section>
      <section id="panel-network" class="panel" role="tabpanel" aria-labelledby="tab-network" hidden></section>
      <section id="panel-security" class="panel" role="tabpanel" aria-labelledby="tab-security" hidden></section>
      <section id="panel-design" class="panel" role="tabpanel" aria-labelledby="tab-design" hidden></section>
    </main>

    <footer class="footer">
      <span id="footer-meta" class="footer-meta mono"></span>
      <div class="footer-links">
        <a class="footer-link" href="https://github.com/EmmanouelKontos/deepstack" target="_blank" rel="noopener noreferrer"><span id="icon-github"></span>Source</a>
        <a class="footer-link" href="https://buymeacoffee.com/emmanouilkontos" target="_blank" rel="noopener noreferrer"><span id="icon-coffee"></span>Support</a>
      </div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>

<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Store icon: 96x96 artwork with 16px transparent padding, per Chrome Web Store image guidance. -->
  <defs>
    <linearGradient id="bgGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B1D23"/>
      <stop offset="100%" stop-color="#0B0C0E"/>
    </linearGradient>
    <linearGradient id="topFace" x1="34" y1="22" x2="94" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7CDD6"/>
      <stop offset="100%" stop-color="#7A808C"/>
    </linearGradient>
    <linearGradient id="midFace" x1="34" y1="22" x2="94" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#959CA8"/>
      <stop offset="100%" stop-color="#525864"/>
    </linearGradient>
  </defs>

  <rect x="16.5" y="16.5" width="95" height="95" rx="22" fill="url(#bgGrad)"/>
  <rect x="16.5" y="16.5" width="95" height="95" rx="22" stroke="#FFFFFF" stroke-opacity="0.16"/>

  <!-- Slabs: drawn on the original 128 grid, scaled to 80x80 and centred in the tile -->
  <g transform="translate(24 25) scale(0.8333) translate(-16 -14)">
    <g transform="translate(0 44)">
      <polygon points="64,22 94,38 64,54 34,38" fill="url(#midFace)" stroke="#E4E4E7" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="34,38 64,54 64,65 34,49" fill="#323842" stroke="#38BDF8" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="64,54 94,38 94,49 64,65" fill="#181B20" stroke="#34D399" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g transform="translate(0 22)">
      <polygon points="64,22 94,38 64,54 34,38" fill="url(#midFace)" stroke="#F4F4F5" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="34,38 64,54 64,65 34,49" fill="#3B424E" stroke="#38BDF8" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="64,54 94,38 94,49 64,65" fill="#1E2229" stroke="#34D399" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <polygon points="64,22 94,38 64,54 34,38" fill="url(#topFace)" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="34,38 64,54 64,65 34,49" fill="#464E5C" stroke="#38BDF8" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="64,54 94,38 94,49 64,65" fill="#232730" stroke="#34D399" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
</svg>
